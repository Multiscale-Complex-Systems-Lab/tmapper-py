# =============================================================================
# .github/workflows/publish.yml
#
# Builds the distributions and uploads them to PyPI when a GitHub Release is
# published, so `pip install tmapper` works.
#
# Uses PyPI "Trusted Publishing" (OpenID Connect) rather than an API token:
# PyPI is configured to trust *this repository and workflow*, and GitHub
# mints a short-lived credential for the job. Nothing secret is stored in the
# repo, and there is no token to rotate or leak.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP before the first release
#
# 1. Create the project on PyPI via a trusted publisher:
#      https://pypi.org/manage/account/publishing/
#    Fill in:
#      PyPI project name : tmapper
#      Owner             : Multiscale-Complex-Systems-Lab
#      Repository name   : tmapper-py
#      Workflow name     : publish.yml
#      Environment name  : pypi
#
# 2. Create a GitHub environment named `pypi`
#    (Settings -> Environments -> New environment). Adding required
#    reviewers there means a release waits for an explicit approval before
#    anything is uploaded.
#
# To rehearse first, do the same at https://test.pypi.org and temporarily
# point the upload step at repository-url: https://test.pypi.org/legacy/
#
# NOTE: a version can never be re-uploaded to PyPI, even after deleting it.
# Bump `version` in pyproject.toml for every release.
# =============================================================================
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Catches metadata problems (bad README rendering, malformed
      # classifiers) here rather than on upload, where they fail late.
      - name: Check the built metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # The tag should match what setuptools actually built, or the release
      # notes end up describing a different version than the one uploaded.
      - name: Verify the tag matches the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $version   release tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag '$tag' does not match pyproject version '$version'."
            exit 1
          fi

      - name: Upload the distributions as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # required for trusted publishing; nothing else needs write access
      id-token: write
    steps:
      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
