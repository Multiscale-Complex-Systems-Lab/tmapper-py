# =============================================================================
# .github/workflows/docs.yml
#
# Automatically builds the MkDocs site and publishes it to GitHub Pages every
# time you push to the `main` branch. The built HTML is pushed to a `gh-pages`
# branch, which GitHub serves at:
#   https://multiscale-complex-systems-lab.github.io/tmapper-py/
#
# One-time setup (in the GitHub repo settings, done once by a maintainer):
#   Settings -> Pages -> "Build and deployment" -> Source: "Deploy from a
#   branch" -> Branch: gh-pages / (root). The first push to main after this
#   workflow is added will create the gh-pages branch automatically.
# =============================================================================
name: Deploy docs

on:
  push:
    branches:
      - main

# The job needs write access to push the built site to the gh-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # mkdocstrings needs to import `tmapper` itself to read its docstrings,
      # so install the package (with its plotting extra) alongside the docs
      # dependencies in one go.
      - name: Install tmapper and documentation dependencies
        run: pip install -e ".[plot,docs]"

      - name: Build and deploy
        run: mkdocs gh-deploy --force
