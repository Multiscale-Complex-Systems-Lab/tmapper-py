# =============================================================================
# .github/workflows/tests.yml
#
# Runs the pytest suite in tests/ on every push to `main` and on every pull
# request, across the Python versions declared supported in pyproject.toml
# (requires-python >= 3.10), so a broken change gets flagged before it merges.
# =============================================================================
name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tmapper
        run: pip install -e ".[plot,test]"

      - name: Run test suite
        run: pytest -v
