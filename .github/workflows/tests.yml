# =============================================================================
# .github/workflows/tests.yml
#
# Runs the pytest suite in tests/ on every push to `main` and on every pull
# request, across the Python versions declared supported in pyproject.toml
# (requires-python >= 3.10), so a broken change gets flagged before it merges.
# =============================================================================
name: Run tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  # tests/test_visualization.py and the app's export paths render real
  # figures, and the runner has no display -- pin the non-interactive
  # backend rather than relying on matplotlib guessing right.
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The `app` extra is what pulls in streamlit, and it supersedes `plot`
      # (same matplotlib/igraph/pyvis, plus streamlit). Without it,
      # tests/test_app.py hits its `pytest.importorskip("streamlit")` and all
      # 52 of its tests are skipped -- while the run still reports green, so
      # the app would look covered when none of it had run.
      - name: Install tmapper
        run: pip install -e ".[app,test]"

      # Fail loudly if the extras ever stop providing these, rather than
      # letting importorskip quietly drop a large part of the suite again.
      - name: Check optional test dependencies are present
        run: python -c "import streamlit, matplotlib, igraph, pyvis"

      - name: Run test suite
        run: pytest -v
